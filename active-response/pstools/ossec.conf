<active-response>
  <disabled>no</disabled>
  <command>pssuspend</command>
  <location>local</location>
  <rules_id>100510,100520,100530,100540,100550,100560,100570,100580,100590,100600,100610,100620,100630,100640,100650,100660</rules_id>
</active-response>
</rules_id>



